spring:
  application:
    name: FunctionCall
  profiles:
    active: local
  config:
    import: optional:file:.env
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com
      model: qwen3.7-plus
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/
      chat:
        options:
          model: qwen3.7-plus
          temperature: 0.7
          maxTokens: 5000
server:
  port: 8080
langchain4j:
  open-ai:
    chat-model:
      api-key: ${LANGCHAIN4J_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model-name: qwen3.7-plus
      log-requests: true
      log-responses: true
    streaming-chat-model:
      api-key: ${LANGCHAIN4J_STREAMING_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model-name: qwen3.7-plus
      log-requests: true
      log-responses: true
